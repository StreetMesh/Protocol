name: Deploy Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    working-directory: docs

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # Named rather than left to setup-node's detection, which turns
          # itself on for a `packageManager` field this package.json does not
          # have, and which needs the path either way: the lockfile is a
          # directory down from the repository root.
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Deps
        run: npm ci

      - name: Build Docs
        # Static files: `next build` writes docs/out because next.config.mjs
        # asks for `output: 'export'`. Nothing runs on the far side of this.
        #
        # The marker keeps Pages from running the output through Jekyll, which
        # drops directories whose names begin with an underscore — and Next
        # puts every script and stylesheet in `_next`.
        run: |
          npm run build
          touch out/.nojekyll

      - name: Deploy Docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/out
